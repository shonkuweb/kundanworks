version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  kundanworks-db:
    image: postgres:16-alpine
    container_name: kundanworks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kundanworks}
      POSTGRES_USER: ${POSTGRES_USER:-kundan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kundan_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kundan_admin} -d ${POSTGRES_DB:-kundanworks}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kundan-net

  # ==========================================
  # 2. Node.js Express REST API Service
  # ==========================================
  kundanworks-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kundanworks-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      POSTGRES_HOST: kundanworks-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kundanworks}
      POSTGRES_USER: ${POSTGRES_USER:-kundan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kundan_secure_pass_2026}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      kundanworks-db:
        condition: service_healthy
    networks:
      - kundan-net

  # ==========================================
  # 3. Nginx Web & Reverse Proxy Service
  # ==========================================
  kundanworks-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kundanworks-app
    restart: unless-stopped
    ports:
      # Host port 3040 maps to internal container port 80.
      # You can change PORT in your .env file on the VPS if 3040 is occupied.
      - "${PORT:-3040}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - kundanworks-api
    labels:
      - "project=kundanworks"
      - "domain=kundanworks.shonku.site"
    networks:
      - kundan-net

volumes:
  postgres_data:
    name: kundan_postgres_data
  uploads_data:
    name: kundan_uploads_data

networks:
  kundan-net:
    driver: bridge

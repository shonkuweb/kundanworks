
<svg width='900' height='240' viewBox='0 0 900 240' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <!-- Royal Metallic Gold Gradient -->
    <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#F5E096' />
      <stop offset='25%' stop-color='#D4AF37' />
      <stop offset='50%' stop-color='#FFF2B2' />
      <stop offset='75%' stop-color='#C59B27' />
      <stop offset='100%' stop-color='#8F680D' />
    </linearGradient>

    <!-- Deep Velvet Maroon Gradient for Crest -->
    <linearGradient id='velvetGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#660D20' />
      <stop offset='100%' stop-color='#2B050D' />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id='goldGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='1.5' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>

  <!-- Left: PLH Crest Medallion -->
  <g transform='translate(20, 20)'>
    <!-- Outer Concentric Gold Rings -->
    <circle cx='100' cy='100' r='94' fill='none' stroke='url(#goldGrad)' stroke-width='2.5' stroke-dasharray='6 3' />
    <circle cx='100' cy='100' r='88' fill='none' stroke='url(#goldGrad)' stroke-width='1.5' />
    <circle cx='100' cy='100' r='82' fill='url(#velvetGrad)' stroke='url(#goldGrad)' stroke-width='2.5' />

    <!-- Inner Decorative Diamond Dots -->
    <circle cx='100' cy='24' r='3.5' fill='url(#goldGrad)' />
    <circle cx='100' cy='176' r='3.5' fill='url(#goldGrad)' />
    <circle cx='24' cy='100' r='3.5' fill='url(#goldGrad)' />
    <circle cx='176' cy='100' r='3.5' fill='url(#goldGrad)' />

    <!-- Royal Inner Monogram Rounded Box -->
    <rect x='48' y='52' width='104' height='96' rx='22' fill='#1A0408' stroke='url(#goldGrad)' stroke-width='2' />

    <!-- PLH Monogram -->
    <text x='100' y='116' font-family='"Playfair Display", Georgia, "Cinzel", serif' font-size='44' font-weight='800' fill='url(#goldGrad)' text-anchor='middle' letter-spacing='3'>PLH</text>

    <!-- Small Registered / Surat Badge -->
    <text x='100' y='136' font-family='"Plus Jakarta Sans", sans-serif' font-size='9.5' font-weight='700' fill='#F5E096' text-anchor='middle' letter-spacing='2.5'>SURAT</text>
  </g>

  <!-- Right: Regal Brand Typography -->
  <g transform='translate(245, 0)'>
    <!-- Brand Title: POOJA -->
    <text x='0' y='82' font-family='"Playfair Display", Georgia, serif' font-size='56' font-weight='800' fill='url(#goldGrad)' letter-spacing='5'>POOJA</text>

    <!-- Brand Title: LACE HUB -->
    <text x='0' y='142' font-family='"Playfair Display", Georgia, serif' font-size='48' font-weight='700' fill='url(#goldGrad)' letter-spacing='6'>LACE HUB</text>

    <!-- Ornamental Flourish Divider -->
    <g transform='translate(0, 166)' stroke='url(#goldGrad)' fill='url(#goldGrad)'>
      <line x1='0' y1='0' x2='150' y2='0' stroke-width='1.5' />
      <polygon points='165,-5 175,0 165,5 155,0' />
      <circle cx='188' cy='0' r='3' />
      <polygon points='208,-5 218,0 208,5 198,0' />
      <line x1='230' y1='0' x2='380' y2='0' stroke-width='1.5' />
    </g>

    <!-- Subtitle: BANJARA • GOTA • HANDWORK • SURAT -->
    <text x='2' y='198' font-family='"Plus Jakarta Sans", sans-serif' font-size='15.5' font-weight='700' fill='#D4AF37' letter-spacing='4.5'>BANJARA • GOTA • HANDWORK • SURAT</text>
  </g>
</svg>

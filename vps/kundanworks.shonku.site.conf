# ================================================================
# Nginx Virtual Host Configuration for kundanworks.shonku.site
# Location on VPS: /etc/nginx/sites-available/kundanworks.shonku.site.conf
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name kundanworks.shonku.site;

    # Forward traffic to the Kundan Works Docker Container
    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom Error Pages
    error_page 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        return 503 "Kundan Works service is starting up or temporarily updating. Please refresh in a moment.\n";
    }
}

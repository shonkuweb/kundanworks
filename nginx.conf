server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Backend API Proxy (Forward to Node.js API container)
    location /api/ {
        proxy_pass http://kundanworks-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 35M;
    }

    # Uploaded Media Proxy
    location /uploads/ {
        proxy_pass http://kundanworks-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 35M;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Single Page Application (SPA) Routing
    # Send all requests to index.html so React Router handles URLs like /product/:id and /order
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (JS, CSS, images, SVGs, web fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Health check endpoint for Docker / Load Balancer
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
